name: Read Telegram Message  
  
on:  
  workflow_dispatch:  
  
jobs:  
  read-message:  
    runs-on: ubuntu-latest  
    steps:  
      - name: Get latest message from Telegram  
        run: |  
          curl -s "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/getUpdates" > updates.json  
  
      - name: Extract clean message text  
        run: |  
          MESSAGE=$(cat updates.json | jq -r '.result[-1].message.text')  
          echo "Extracted message: $MESSAGE"  
          echo "MESSAGE=$MESSAGE" >> $GITHUB_ENV  
  
      - name: Check command  
        run: |  
          if [ "$MESSAGE" = "Create today's Instagram post" ]; then  
            echo "Command recognized: create_post"  
            curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \  
              -d chat_id="${{ secrets.TELEGRAM_CHAT_ID }}" \  
              -d text="✅ Command recognized: Create today's Instagram post. (Next steps not built yet.)"  
          else  
            echo "No matching command found for: $MESSAGE"  
            curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \  
              -d chat_id="${{ secrets.TELEGRAM_CHAT_ID }}" \  
              -d text="❓ I don't recognize that command yet: $MESSAGE"  
          fi  
