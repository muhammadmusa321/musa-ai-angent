name: Read Telegram Message & Generate Instagram Post

on:
  workflow_dispatch:

jobs:
  read-and-generate:
    runs-on: ubuntu-latest
    steps:
      - name: Get latest message from Telegram
        run: |
          curl -s "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/getUpdates" > updates.json

      - name: Process Message and Run AI Brain
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python3 -c "
          import os, json, urllib.request, urllib.error

          with open('updates.json', 'r') as f:
              updates = json.load(f)

          bot_token = os.environ.get('TELEGRAM_BOT_TOKEN', '').strip()
          chat_id = os.environ.get('TELEGRAM_CHAT_ID', '').strip()
          gemini_key = os.environ.get('GEMINI_API_KEY', '').strip()

          try:
              message = updates['result'][-1]['message']['text'].strip()
          except Exception:
              message = ''

          def send_telegram(text):
              url = f'https://api.telegram.org/bot{bot_token}/sendMessage'
              payload = json.dumps({'chat_id': chat_id, 'text': text}).encode('utf-8')
              req = urllib.request.Request(url, data=payload, headers={'Content-Type': 'application/json'})
              try:
                  urllib.request.urlopen(req)
              except Exception as e:
                  print('Telegram Send Error:', e)

          if message == \"Create today's Instagram post\":
              send_telegram('🤖 Command Recognized! Generating Instagram Post with AI Brain...')
              
              if not gemini_key.startswith('AIzaSy'):
                  send_telegram('⚠️ Warning: GEMINI_API_KEY does not start with AIzaSy. Please re-copy from AI Studio!')

              prompt = (
                  'You are Hermes Agent, an expert AI Instagram Content Creator. '
                  'Generate an engaging Instagram post about a modern AI or Tech topic. '
                  'Include:\\n'
                  '1. Catchy Headline\\n'
                  '2. Engaging Caption (with emojis)\\n'
                  '3. 5-10 Relevant Hashtags\\n'
                  '4. An AI Image Generation Prompt (for Midjourney/Flux).\\n'
                  'Keep formatting clean and readable.'
              )
              
              models = ['gemini-1.5-flash', 'gemini-1.5-flash-latest', 'gemini-2.0-flash', 'gemini-pro']
              ai_post = None
              error_details = ''

              for m in models:
                  url = f'https://generativelanguage.googleapis.com/v1beta/models/{m}:generateContent?key={gemini_key}'
                  payload = json.dumps({'contents': [{'parts': [{'text': prompt}]}]}).encode('utf-8')
                  try:
                      req = urllib.request.Request(url, data=payload, headers={'Content-Type': 'application/json'})
                      res = urllib.request.urlopen(req)
                      data = json.loads(res.read().decode('utf-8'))
                      ai_post = data['candidates'][0]['content']['parts'][0]['text']
                      if ai_post:
                          break
                  except urllib.error.HTTPError as e:
                      error_body = e.read().decode('utf-8')
                      error_details = f'HTTP {e.code}: {error_body[:150]}'
                  except Exception as e:
                      error_details = str(e)

              if ai_post:
                  send_telegram(f'✨ HERMES AGENT POST GENERATED ✨\\n\\n{ai_post}')
              else:
                  send_telegram(f'⚠️ Error from AI Brain: {error_details}')
          else:
              send_telegram(f'❓ Unrecognized Command: \"{message}\"')
          "
